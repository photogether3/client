<div
  class="flex h-12 w-full items-center justify-center gap-2 rounded-full bg-white px-4 text-body-m text-gray90 shadow-[2px_4px_8px_0px_rgba(0,0,0,0.15)] ring-1 ring-gray10 focus-within:ring-2 focus-within:ring-primary50">
  <app-icon name="search" [size]="20" />
  <input
    #inputRef
    type="text"
    placeholder="사진첩 전체 검색하기"
    [value]="value()"
    (input)="onInput($event)"
    class="w-full h-full rounded-r-full outline-none placeholder:text-gray50" />
  @if (value()) {
    <button (click)="resetValue()">
      <app-icon name="close-circle" [size]="20" />
    </button>
  }
</div>
