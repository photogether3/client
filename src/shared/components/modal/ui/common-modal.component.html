<div class="max-w-[350px] rounded-[12px] border border-white/20 bg-layer40 bg-opacity-80 p-8">
  <div [ngClass]="{ 'mb-5': data.title }" class="flex items-center justify-between">
    @if (data.title) {
      <h6 class="font-bold text-white text-body-m">{{ data.title }}</h6>
    }
    <button (click)="close()" class="ml-auto">
      <app-icon name="close" class="text-white" />
    </button>
  </div>

  <div class="flex flex-col items-center gap-5">
    @if (data.iconName) {
      <app-icon [name]="data.iconName" />
    }

    <div [ngClass]="{ 'text-center': !data.title }">
      <p class="mb-2.5 text-body-l font-bold text-white">{{ data.subTitle }}</p>
      <p class="text-body-m text-gray30">{{ data.content }}</p>
    </div>

    <div class="flex items-center w-full gap-4">
      @if (data.buttons.length > 1) {
        @for (buttonText of data.buttons; track $index; let first = $first; let last = $last) {
          <app-button [text]="buttonText" [appearance]="first ? 'tertiary' : 'primary'" (click)="close(buttonText)" class="flex-1" />
        }
      } @else {
        <app-button [text]="data.buttons[0]" (click)="close(data.buttons[0])" class="flex-1" />
      }
    </div>
  </div>
</div>
