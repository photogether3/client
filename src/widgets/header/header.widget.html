<header class="sticky top-0 z-10 flex max-h-[73px] w-full items-center gap-3 border-b border-b-primary50 px-4 py-5 text-white">
  @if (hasBackButton()) {
    <button (click)="goBack()" class="flex items-center justify-center font-bold size-8">
      <app-icon name="arrow-left" class="text-white" />
    </button>
  }
  @if (hasLogo()) {
    <app-icon name="logo-lg" class="mb-1" />
  } @else {
    <span class="w-full text-xl font-bold truncate">{{ title() }}</span>
  }
  <ng-content select="[rightContent]" />
</header>
