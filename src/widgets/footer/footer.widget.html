<footer class="z-10 h-[80px] border-t border-t-layer20 bg-[#1b1d21]/80 shadow-[2px_5px_8px_0_rgba(0,0,0,0.2)] backdrop-blur-[20px]">
  @if (!hasButton()) {
    <ul class="flex h-full items-center justify-around text-sm [&>li]:flex [&>li]:cursor-pointer [&>li]:flex-col [&>li]:items-center [&>li]:gap-1">
      <li routerLink="/home" [class]="isCurrentUrl('home') ? 'text-primary60' : 'text-gray50'" class="hover:font-bold">
        <app-icon [name]="isCurrentUrl('home') ? 'home-fill' : 'home'" />
        <span [ngClass]="{ 'size-1 rounded-full bg-primary50': isCurrentUrl('home') }"></span>
      </li>
      <li routerLink="/post/create" [class]="isCurrentUrl('post/create') ? 'text-primary60' : 'text-gray50'" class="hover:font-bold">
        <app-icon name="picture1" />
        <span [ngClass]="{ 'size-1 rounded-full bg-primary50': isCurrentUrl('post/create') }"></span>
      </li>
      <li routerLink="/profile" [class]="isCurrentUrl('profile') ? 'text-primary60' : 'text-gray50'" class="hover:font-bold">
        <app-icon [name]="isCurrentUrl('profile') ? 'user-fill' : 'user'" />
        <span [ngClass]="{ 'size-1 rounded-full bg-primary50': isCurrentUrl('profile') }"></span>
      </li>
    </ul>
  } @else {
    <div class="px-5 pt-3">
      <ng-content select="[button]" />
    </div>
  }
</footer>
