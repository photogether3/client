<div class="w-full divide-y divide-white/20">
  @for (action of actionTypes(); track $index; let first = $first) {
    <app-button
      [text]="action.text"
      [leftIcon]="action.icon"
      [iconSize]="15"
      [appearance]="action.appearance"
      (click)="handleClick(action.type)"
      [ngClass]="first ? 'pb-4' : 'py-4'" />
  }
</div>
