<form [formGroup]="form" class="flex flex-col gap-2.5">
  @if (type() === 'update') {
    <app-input
      label="기존 비밀번호"
      inputType="password"
      formControlName="currentPassword"
      [hasInfoIcon]="true"
      info="숫자, 영문자, 특수문자를 포함 8~15자"
      [hasError]="!!getErrorMessage('currentPassword')"
      placeholder="비밀번호" />
    @if (getErrorMessage('currentPassword')) {
      <p class="ml-1 text-xs text-red-600">{{ getErrorMessage('currentPassword') }}</p>
    }
  }
  <app-input
    label="신규 비밀번호"
    inputType="password"
    formControlName="password"
    [hasInfoIcon]="true"
    info="숫자, 영문자, 특수문자를 포함 8~15자"
    [hasError]="!!getErrorMessage('currentPassword')" />
  @if (getErrorMessage('password')) {
    <p class="ml-1 text-xs text-red-600">{{ getErrorMessage('password') }}</p>
  }
  <app-input
    label="신규 비밀번호 확인"
    inputType="password"
    formControlName="confirmPassword"
    [hasInfoIcon]="true"
    info="숫자, 영문자, 특수문자를 포함 8~15자"
    [hasError]="!!getErrorMessage('currentPassword')" />
  @if (getErrorMessage('confirmPassword')) {
    <p class="ml-1 text-xs text-red-600">{{ getErrorMessage('confirmPassword') }}</p>
  }
  <!-- <app-button text="확인" [isDisabled]="form.invalid" (click)="updatePassword()" /> -->
</form>
