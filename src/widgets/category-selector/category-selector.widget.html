<section class="h-full rounded-[8px] border border-gray90 bg-layer30 p-5">
  <div class="flex flex-wrap gap-4">
    @for (category of categoryList(); track $index) {
      <app-tag
        [type]="category.selected ? 'solid' : 'outline'"
        [tagName]="category.name"
        size="lg"
        (click)="toggleCategory(category.id)"
        class="inline-flex w-auto cursor-pointer" />
    }
  </div>
</section>
