<!-- TODO step 1,2가 있는 것 상태관리 -->
<app-header title="환영합니다">
  <div rightContent class="flex items-center gap-2 text-white">
    <span class="whitespace-nowrap text-body-m font-bold">{{ step() === 1 ? '정보입력' : '관심주제' }}</span>
    <p class="flex text-body-m">
      <span class="font-bold text-primary60">{{ step() }}</span>
      /2
    </p>
  </div>
</app-header>

<main class="flex flex-1 flex-col px-4 pt-4">
  @if (step() === 1) {
    <p class="mb-10 text-body-s text-gray40">
      회원가입이 거의 완료되었습니다. <br />
      회원님에 대해서 알려주세요.
    </p>
    <app-profile-update-form #profileForm />
  } @else {
    <p class="mb-10 text-body-s text-gray40">
      회원님의 관심주제를 선택해주세요. <br />
      선택한 주제에 대한 사진첩을 만드실 수 있습니다.
    </p>
    <app-category-selector type="all" [isMultiSelect]="true" />
    <p class="mb-5 text-center text-body-s font-bold text-primary40">선택한 주제는 나중에 다시 수정할 수 있어요!</p>
  }
</main>

<app-footer [hasButton]="true">
  @if (step() === 1) {
    <app-button button text="다음으로" [isDisabled]="buttonDisabled" (click)="clickFooterButton()" />
  } @else {
    <app-profile-update-button button buttonText="사진첩 정리하러 가기" [isDisabled]="buttonDisabled" [form]="profileSnapshot()!" (handleButton)="updateProfile()" />
  }
</app-footer>
