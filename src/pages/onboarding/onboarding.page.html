<div class="min-h-screen bg-white">
  <!-- TODO step 1,2가 있는 것 상태관리 -->
  <app-header>
    <p rightContent class="flex items-center">
      <span class="font-bold">{{ activeStep() }}</span>
      /2
    </p>
  </app-header>

  <section class="flex flex-col gap-5 px-4 pt-4">
    @if (activeStep() === 1) {
      <p class="text-gray70">
        회원가입이 거의 완료되었습니다. <br />
        회원님에 대해서 알려주세요.
      </p>
      <app-profile-update-form />
      <app-button text="다음으로" (click)="setStep(2)" />
    } @else {
      <p class="text-gray70">
        회원님의 관심주제를 선택해주세요. <br />
        선택한 주제에 대한 사진첩을 만드실 수 있습니다.
      </p>

      <app-category-selector [isMultiSelect]="true" [selectedCategoryList]="selectedCategoryList()" (selectedCategoryListChange)="updateSelectedCategories($event)" />

      <p class="text-center">선택한 주제는 나중에 다시 수정할 수 있어요!</p>
      <!-- <app-profile-update-button buttonText="사진첩 정리하러 가기" [form]="form" (handleButton)="updateProfile()" /> -->
    }
  </section>
</div>
