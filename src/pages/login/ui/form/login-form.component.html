<form [formGroup]="form" (ngSubmit)="onLogin()" class="flex flex-col w-full gap-4">
  <div>
    <app-input formControlName="email" placeholder="포토게더 아이디" leftIcon="user" [hasError]="!!getErrorMessage('email')" />
    @if (getErrorMessage('email')) {
      <p class="mt-2 text-detail-l text-accent40">{{ getErrorMessage('email') }}</p>
    }
  </div>
  <div>
    <app-input inputType="password" formControlName="password" placeholder="비밀번호" leftIcon="lock" [hasError]="!!getErrorMessage('password')" />
    @if (getErrorMessage('password')) {
      <p class="mt-2 text-detail-l text-accent40">{{ getErrorMessage('password') }}</p>
    }
  </div>
  
  <!-- 로그인 상태 유지 체크박스 추가 -->
  <div class="flex items-center mt-2">
    <input 
      type="checkbox" 
      id="rememberMe" 
      formControlName="rememberMe"
      class="w-4 h-4 mr-2 rounded border-gray40 accent-primary50"
    />
    <label for="rememberMe" class="select-none text-body-s text-gray40">로그인 상태 유지</label>
  </div>
  
  <app-button text="로그인" [isDisabled]="!isValid()" type="submit" class="block mt-4" />
</form>
