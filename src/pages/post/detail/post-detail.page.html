<div class="flex flex-col min-h-screen border-x bg-gray10">
  <app-header [title]="post?.title ?? ''">
    <button rightContent (click)="openBottomSheet()" class="text-lg font-bold">
      <app-icon name="more" />
    </button>
  </app-header>

  <main class="flex-1 w-full px-4 py-5">
    @defer {
      @if (post) {
        <div class="flex flex-col gap-5">
          <div class="shadow-custom rounded-[8px] bg-white px-4 py-5">
            <img [src]="post.imageUrl" alt="임시 이미지" class="h-[485px] w-full rounded-[8px]" />
          </div>

          <section class="mb-5 rounded-[8px] bg-white px-4 py-5">
            <div class="flex items-center justify-between pb-4 border-b border-b-gray40">
              <app-tag [tagName]="post.category?.name" />
              <p class="flex items-center gap-2">
                <app-icon name="folder" />
                <span class="font-bold text-detail text-gray90">{{ post.collection.title }}</span>
              </p>
            </div>

            <div class="flex flex-col gap-2.5 border-b border-b-gray40 py-5 text-gray90">
              <span class="font-bold text-body-s">게시물 내용</span>
              <p class="text-detail">{{ post.content }}</p>
            </div>

            <div class="flex flex-col gap-2.5 pt-5">
              <span class="font-bold text-body-s">사진 내용</span>
              <ul class="flex flex-col gap-2.5">
                @for (imgContent of post.metadataList; track $index) {
                  @if (imgContent.isPublic) {
                    <li class="list-disc list-inside text-detail">{{ imgContent.content }}</li>
                  }
                }
              </ul>
            </div>
          </section>
        </div>
      }
    } @loading {
      <div class="flex flex-col items-center justify-center min-h-screen text-center bg-white">게시물 정보를 찾을 수 없습니다. 다시 시도해주세요.</div>
    }
    <app-button text="목록으로 돌아가기" width="full" (click)="goPage()" />
  </main>

  <app-footer class="sticky bottom-0 mt-auto" />
</div>
