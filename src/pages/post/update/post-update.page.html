<div class="flex flex-col min-h-screen border-x bg-layer40">
  <app-header title="게시물 수정" />

  <div class="flex-1 w-full py-10">
    <div class="mx-auto mb-10 flex h-[480px] w-[270px] items-center justify-center rounded-[12px] border-2 border-primary50 bg-[#182B28] shadow-custom">
      @if (previewUrl) {
        <img [src]="previewUrl" alt="임시 이미지" class="h-full w-full overflow-hidden rounded-[12px] shadow-custom" />
      } @else {
        <p class="text-white">사진을 불러오지 못 했습니다.</p>
      }
    </div>
    <app-post-form [isEditMode]="true" #postForm />
  </div>

  <app-footer [hasButton]="true">
    <app-button button text="수정된 내용 저장하기" width="full" (click)="updatePost()" />
  </app-footer>
</div>
