<div class="bg-layer40 flex min-h-screen flex-col border-x">
  <app-header title="프로필 수정" />

  <div class="flex w-full flex-1 flex-col gap-5 px-4 py-6">
    <app-profile-update-form [profileInitForm]="profileForm()" (profileUpdatedForm)="updateForm($event)" />

    <div class="flex gap-2">
      @for (category of categories(); track $index) {
        <app-tag [tagName]="category.name" appearance="solid" size="md" />
      }
    </div>

    <div class="flex flex-col gap-2">
      <app-button text="관심태그 변경" width="full" (click)="updateCategory()" class="w-full" />
      <app-profile-update-button buttonText="프로필 편집 완료" [form]="updatedForm()" (handleButton)="updateProfile()" />
    </div>
  </div>

  <!-- footer -->
  <app-footer class="sticky bottom-0 mt-auto" />
</div>
