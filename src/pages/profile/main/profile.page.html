<div class="bg-layer40 flex min-h-screen flex-col border-x">
  @if (profile) {
    <app-header title="내 프로필 조회" />

    <div class="flex w-full flex-1 flex-col gap-5 px-4 py-6">
      <img [src]="profile.imageUrl || 'assets/images/default-image.webp'" alt="프로필 임시 이미지" class="mx-auto block size-28 rounded-full border bg-white" />
      <div>
        <span class="block text-center text-lg font-bold">{{ profile.nickname }}</span>
        <span class="block text-center text-sm text-gray-600">&#64;{{ profile.email.split('@')[0] }}</span>
      </div>
      <div class="text-sm">
        <span class="block">
          <span class="mr-4 inline-block font-semibold">이메일 |</span>
          {{ profile.email }}
        </span>
        <p>
          <span class="mr-4 inline-block font-semibold">자기소개 | </span>
          {{ profile.bio }}
        </p>
      </div>
      <div class="flex gap-2">
        @for (tag of profile.tags; track $index) {
          <app-tag [tagName]="tag.name" appearance="outline" size="md" />
        }
      </div>
      <div class="flex flex-col gap-2">
        <app-button text="프로필 수정" width="full" (click)="goUpdatePage()" class="w-full" />
        <app-button text="로그아웃" width="full" (click)="onLogout()" class="w-full" />
        <app-button text="비밀번호 변경" width="full" (click)="updatePassword()" class="w-full" />
        <app-button text="기록 초기화" width="full" (click)="reset()" class="w-full" />
        <app-button text="회원탈퇴" appearance="secondary" width="full" (click)="withdraw()" class="w-full" />
      </div>
    </div>
  }

  <app-footer class="sticky bottom-0 mt-auto" />
</div>
