<section
  (click)="goPage()"
  class="shadow-custom flex flex-col items-center justify-center gap-2 rounded-[12px] bg-white p-2 hover:cursor-pointer hover:ring-1 hover:ring-primary50">
  <div
    [ngClass]="{ 'grid grid-cols-2': post().imageUrls.length === 2, 'grid grid-cols-2 grid-rows-2': post().imageUrls.length === 3 }"
    class="h-[145px] w-full overflow-hidden rounded-[12px]">
    @for (imageUrl of post().imageUrls; track $index; let i = $index) {
      <img [src]="imageUrl" [ngClass]="{ 'row-span-full': i === 1 }" class="object-cover w-full h-full" />
    }
  </div>
  @if (post().type === 'DEFAULT') {
    <app-tag [tagName]="post().category?.name || ''" type="solid" />
  }
  <div class="text-center">
    <h4 class="font-bold text-detail text-gray90">{{ post().title }}</h4>
    <span class="text-detail text-gray50">{{ post().postCount }}개 사진</span>
  </div>
</section>
