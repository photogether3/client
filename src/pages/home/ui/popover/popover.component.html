<ul class="text-detail-l whitespace-nowrap rounded-[12px] bg-[#2A2C3499]/60 px-3 py-2 ring-2 ring-primary50">
  @for (item of items(); track $index) {
    <li [ngClass]="item.color">
      <button (click)="item.action()" class="flex items-center gap-1">
        <app-icon [name]="item.icon" [size]="12" />
        <span>{{ item.label }}</span>
      </button>
    </li>
  }
</ul>
