<section
  (click)="goPage()"
  class="flex flex-col items-center justify-center gap-4 rounded-[12px] bg-white px-5 py-4 shadow-custom hover:cursor-pointer hover:ring-1 hover:ring-primary50">
  <div class="flex w-full items-center justify-between">
    <div class="flex items-center gap-3">
      <app-tag [tagName]="post().category?.name || ''" type="solid" />
      <h4 class="text-body-m font-bold text-gray90">{{ post().title }}</h4>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-detail text-gray40">{{ post().postCount }}개 사진</span>
      <button (click)="handlePopover()" [ngClass]="isOpenPopover() ? 'bg-primary50' : ''" class="size-5 rounded-full">
        <app-icon name="more" [size]="20" />
      </button>
    </div>
  </div>
  <div class="flex w-full gap-3 overflow-hidden overflow-x-auto border-t border-t-[white/20] py-5">
    @for (imageUrl of post().imageUrls; track $index; let i = $index) {
      <img [src]="imageUrl" class="aspect-[84/183] w-[5.25rem] rounded-[8px] object-cover" />
    }
  </div>
</section>
