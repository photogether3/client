<div class="flex flex-col min-h-screen border-x bg-layer40">
  <app-header title="신규 회원가입">
    <div rightContent class="flex items-center gap-2 text-white">
      <span class="font-bold whitespace-nowrap text-body-m">정보입력</span>
      <p class="flex text-body-m"><span class="text-primary60">{{currentStep()}}</span>/<span>{{totalSteps()}}</span></p>
    </div>
  </app-header>

  <main class="flex-1 px-4">
    <p class="pb-10 pt-2.5 text-body-s text-gray40">
      포토게더에 오신 것을 환영합니다. <br />
      서비스를 이용하기 위해서 OPT 인증이 필요합니다.
    </p>

    <div class="text-gray40">
      OTP 인증 컨텐츠으으으
    </div>
  </main>

  <footer class="p-4">
    <app-button text="다음으로" [isDisabled]="!isValid()" (click)="onNext()" />
  </footer>
</div>
