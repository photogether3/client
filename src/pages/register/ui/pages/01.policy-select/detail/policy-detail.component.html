<header class="relative w-full flex-shrink-0 border-b border-b-primary50 bg-layer40 p-4 text-white">
  <p class="text-center text-title-s font-bold">이용약관</p>
  <button (click)="close()" class="absolute right-4 top-1/2 flex size-8 -translate-y-1/2 items-center justify-center">
    <app-icon name="close" class="text-white" />
  </button>
</header>

@if (!content()) {
  <div class="absolute inset-0">
    <app-loading class="h-full w-full" />
  </div>
}
<main #container [innerHTML]="content()" class="flex-1 overflow-y-auto bg-layer40 p-5 text-white"></main>
