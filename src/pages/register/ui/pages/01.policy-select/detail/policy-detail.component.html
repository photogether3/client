<header class="flex w-full flex-shrink-0 items-center border-b border-b-primary50 bg-layer40 p-4 pt-[env(safe-area-inset-top)] text-white">
  <p class="flex-1 text-center text-title-s font-bold">이용약관</p>
  <button (click)="close()" class="flex size-8 items-center justify-center">
    <app-icon name="close" class="text-white" />
  </button>
</header>

@if (!content()) {
  <div class="absolute inset-0">
    <app-loading class="h-full w-full" />
  </div>
}
<main #container [innerHTML]="content()" class="flex-1 overflow-y-auto bg-layer40 p-5 text-white"></main>
