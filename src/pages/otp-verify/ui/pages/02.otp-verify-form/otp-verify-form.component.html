<main class="flex-1 px-5 pt-2.5">
  <p class="mb-10 text-body-s text-gray40">
    이메일로 인증코드가 발송되었습니다.<br />
    이메일 확인 후, 인증 코드를 입력해주세요.
  </p>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <div>
      <div class="flex items-end gap-2">
        <app-input
          label="인증코드"
          info="인증코드를 입력해주세요"
          [hasInfoIcon]="true"
          placeholder="코드 6자리"
          inputType="text"
          minlength="6"
          maxlength="6"
          formControlName="otp"
          [hasError]="!!getErrorMessage('otp')"
          class="flex-1 w-full" />
        <app-button text="확인" appearance="secondary" [isDisabled]="!isValid()" (click)="onVerify()" class="w-24" />
      </div>
      @if (getErrorMessage('otp')) {
        <p class="mt-2 text-detail-l text-accent40">{{ getErrorMessage('otp') }}</p>
      }
    </div>
    <span class="text-white text-body-s">
      남은 입력시간:
      <span class="font-bold text-accent40">{{ formattedTime }}</span>
    </span>
    <div class="flex justify-between text-body-s">
      <p class="text-gray20">인증코드가 이메일로 전송되지 않았나요?</p>
      <!-- TODO otp 재요청 -->
      <button class="underline text-primary40">재요청</button>
    </div>
  </form>
</main>

@if (page() !== 'register') {
  <app-footer [hasButton]="true">
    <app-button button text="다음으로" rightIcon="arrow-right" [iconSize]="16" [isDisabled]="!isVerified()" (click)="onNext()" />
  </app-footer>
}
