<main class="flex-1 px-5 pt-2.5">
  <p class="mb-10 text-body-s text-gray40">
    회원가입하실 때 입력한 이메일을 입력해주세요.<br />
    해당 이메일로 인증번호를 발송해드립니다.
  </p>

  <!-- TODO 이메일 입력창 컴포넌트로 분리 -->
  <form [formGroup]="form">
    <app-input
      label="이메일"
      formControlName="email"
      [hasError]="!!getErrorMessage('email') || !!errorMessage()"
      [hasInfoIcon]="true"
      info="ex) abc@qwer.com"
      placeholder="이메일을 입력해주세요" />
    @if (getErrorMessage('email')) {
      <p class="mt-2 text-detail-l text-accent60">{{ getErrorMessage('email') }}</p>
    }
  </form>
</main>

<app-footer [hasButton]="true">
  <app-button button text="다음으로" rightIcon="arrow-right" [iconSize]="16" [isDisabled]="!isValid()" (click)="onNext()" />
</app-footer>
