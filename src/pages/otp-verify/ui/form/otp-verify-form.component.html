<form [formGroup]="form" class="flex flex-col gap-4">
  <div>
    <div class="flex items-end gap-2">
      <app-input
        label="인증코드"
        info="인증코드를 입력해주세요"
        [hasInfoIcon]="true"
        placeholder="코드 6자리"
        inputType="text"
        minlength="6"
        maxlength="6"
        formControlName="otp"
        [hasError]="!!getErrorMessage('otp')"
        class="w-full flex-1" />
      <app-button text="확인" [isDisabled]="!isValid()" (click)="onVerify()" class="w-24" />
    </div>
    @if (getErrorMessage('otp')) {
      <p class="mt-2 text-detail text-accent50">{{ getErrorMessage('otp') }}</p>
    }
  </div>
  <span class="text-body-s text-white">
    남은 입력시간:
    <span class="font-bold text-accent40">{{ formattedTime }}</span>
  </span>
  <div class="flex justify-between text-body-s">
    <p class="text-gray20">인증코드가 이메일로 전송되지 않았나요?</p>
    <!-- TODO otp 재요청 -->
    <button class="text-primary40 underline">재요청</button>
  </div>
</form>
