<div (click)="onContainerClick()" class="relative">
  @if (isCheckable()) {
    <input #checkboxRef type="checkbox" (click)="onCheckboxClick($event)" [checked]="selectedPostId() === post().id" class="absolute right-2 top-2 z-20 size-6 cursor-pointer" />
  }
  <figure class="cursor-pointer rounded-[12px] bg-white p-2 shadow-custom hover:ring-1 hover:ring-primary50">
    <figcaption class="w-full">
      <span class="block w-full truncate text-body-s font-bold">{{ post().title }}</span>
      <p class="line-clamp-2 text-detail text-gray50">{{ post().content }}</p>
    </figcaption>
    <img [src]="post().imageUrl" [alt]="post().title" class="mt-2 w-full rounded-[12px]" />
  </figure>
  @if (isCheckable()) {
    <div [ngClass]="selectedPostId() !== post().id ? 'bg-black/20' : 'border border-primary50'" class="absolute inset-0 z-10 rounded-[12px]"></div>
  }
</div>
