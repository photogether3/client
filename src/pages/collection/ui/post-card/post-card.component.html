<div (click)="onContainerClick()" class="relative">
  @if (isCheckable()) {
    <input #checkboxRef type="checkbox" (change)="onSelect(post().id, $event)" [checked]="selectedPostId() === post().id" class="absolute z-20 w-6 h-6 right-2 top-2" />
  }
  <figure class="shadow-custom cursor-pointer rounded-[12px] bg-white p-2 hover:ring-1 hover:ring-primary50">
    <figcaption class="w-full">
      <span class="block w-full font-bold truncate text-body-s">{{ post().title }}</span>
      <p class="line-clamp-2 text-detail text-gray50">{{ post().content }}</p>
    </figcaption>
    <img [src]="post().imageUrl" [alt]="post().title" class="mt-2 w-full rounded-[12px]" />
  </figure>
  @if (isCheckable()) {
    <div [ngClass]="selectedPostId() !== post().id ? 'bg-black/20' : 'border border-primary50'" class="absolute inset-0 z-10 rounded-[12px]"></div>
  }
</div>
