<form [formGroup]="form" class="flex flex-col flex-1 h-full gap-5 p-4">
  <app-input formControlName="title" label="사진첩 제목" placeholder="사진첩 제목을 입력해주세요." [hasInfoIcon]="true" info="사진첩 제목은 추후에 변경이 가능합니다." />
  <div class="flex flex-col flex-1 gap-2">
    <span>관심사 선택</span>
    <app-category-selector
      [isMultiSelect]="false"
      [selectedCategoryList]="this.category() ? [this.category()!] : []"
      (selectedCategoryListChange)="toggleCategory($event)"
      class="flex-1" />
  </div>
  <app-button [text]="mode() === 'create' ? '사진첩 생성하기' : '사진첩 수정하기'" [isDisabled]="form.invalid" (click)="onSubmit()" />
</form>
