<div class="flex flex-col min-h-screen border-x bg-gray10">
  @if (collection) {
    <app-header [title]="collection.title">
      @if (!isEditMode()) {
        <button rightContent (click)="openBottomSheet()">
          <app-icon name="more" />
        </button>
      } @else {
        <app-tag rightContent [tagName]="collection.category?.name" type="solid" />
      }
    </app-header>
  }

  <main class="flex flex-col gap-5 px-4 mt-5">
    @if (!isEditMode()) {
      <app-search-bar />
    } @else {
      <div class="grid grid-cols-2 gap-2">
        <app-button text="게시물 삭제" appearance="tertiary" size="md" (click)="postDelete()" />
        <app-button text="게시물 이동" size="md" (click)="postMove()" />
      </div>
    }
    <div class="flex items-center justify-between">
      @if (!isEditMode()) {
        <app-tag [tagName]="collection?.category?.name" appearance="primary" />
        <p class="font-bold text-body-s">
          <span class="text-primary60">{{ postList?.length }}</span>
          개의 게시물
        </p>
      } @else {
        <div class="flex items-center gap-2">
          <input type="checkbox" class="size-6" />
          <span class="font-bold text-body-s text-gray90">전체선택</span>
        </div>
        <p class="font-bold text-body-s">
          <span class="text-primary60">{{ selectedPostIds().length }}</span>
          개 선택됨
        </p>
      }
    </div>
    <section #grid>
      @for (post of postList || []; track $index) {
        <div #item>
          <app-post-card [post]="post" [isCheckable]="isEditMode()" (postSelected)="onSelect($event)" />
        </div>
      }
    </section>
  </main>

  <app-footer />
</div>
